name: Shared contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --target contracts/.deps -r contracts/requirements.txt
      - run: node contracts/build.mjs --check
      - run: npm ci --prefix contracts --ignore-scripts
      - run: npm run typecheck --prefix contracts
      - run: python contracts/validate.py
      - run: python contracts/test_mock.py
