name: Backend runner engine integration
on:
  push:
    paths: ['backend/**', 'runner/**', 'engine/**', 'contracts/**', 'infra/**', '.github/workflows/backend-integration.yml']
  pull_request:
    paths: ['backend/**', 'runner/**', 'engine/**', 'contracts/**', 'infra/**', '.github/workflows/backend-integration.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: ottv2_test
          POSTGRES_USER: ottv2_test
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ottv2_test -d ottv2_test" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.2-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://ottv2_test:local-test-only@127.0.0.1:5432/ottv2_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --project backend --frozen --python python --no-python-downloads
      - run: uv pip install --python backend/.venv/bin/python -e engine -e runner
      - run: uv pip install --python backend/.venv/bin/python --target contracts/.deps -r contracts/requirements.txt
      - run: backend/.venv/bin/python -m ruff check backend/app backend/tests backend/migrations backend/scripts
      - run: node contracts/build.mjs --check
      - run: backend/.venv/bin/python contracts/validate.py
      - run: backend/.venv/bin/python contracts/test_mock.py
      - run: .venv/bin/python -m pytest -q
        working-directory: backend
      - run: backend/.venv/bin/python -m unittest discover -s engine/tests -v
      - run: backend/.venv/bin/python -m unittest discover -s runner/tests -v
