name: Web contracts and build
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node contracts/build.mjs --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e engine
      - run: python web/tests/generate_engine_replays.py
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
