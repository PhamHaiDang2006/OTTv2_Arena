server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ { return 404; }
    location = /ws { return 404; }
    location = /admin { return 308 /admin/; }
    location /admin/assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; add_header Cache-Control "no-cache"; }
    location / { return 404; }
}
