[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ottv2"
version = "1.0.0"
description = "OTTv2 engine and local development tools (dev-v1 rules)"
requires-python = ">=3.12"

[project.scripts]
ottv2 = "ottv2.cli:main"

[tool.setuptools.packages.find]
include = ["ottv2*"]
